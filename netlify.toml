[build]
  command = "npm run build"
  publish = "_site"

# Allow Decap CMS OAuth (Git Gateway) — enable in Netlify UI when using Identity
[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/product/refine-planner/"
  to = "/product/planner-doodle-refine/"
  status = 301

[[redirects]]
  from = "/product/cup-overflow/"
  to = "/product/christian-devotional-journal/"
  status = 301

[[redirects]]
  from = "/devotional/"
  to = "/devotionals/"
  status = 301

[[headers]]
  for = "/static/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

